[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle
    "RUF", # Ruff-specific
]

ignore = [
    "E501",   # line too long
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"model/**/*.py" = ["D", "RUF"]
# The backend carries user-facing Chinese messages (fullwidth punctuation is
# correct Chinese typography, not an ambiguous copy of an ASCII symbol).
"web/backend/**/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["utils", "model"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
