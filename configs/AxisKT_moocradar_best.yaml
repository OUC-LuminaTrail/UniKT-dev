# Best hyperparameters for AxisKT on moocradar from Optuna search
# (see runs/hyperparam_search/AxisKT_moocradar_*_n_trials100/ for the full study).

experiment:
  model_name: AxisKT

data:
  dataset: moocradar

model:
  hidden_dim: 128
  n_blocks: 4
  conv_kernel_size: 7
  conv_dilation_base: 2
  dropout: 0.45104783296243567
  question_embed_dim: 64
  epochs: 100
  learning_rate: 0.0018851923824304332
  weight_decay: 2.3530797716050317e-05
  batch_size: 64
  max_clip_grad_norm: 1.9184241473014711
