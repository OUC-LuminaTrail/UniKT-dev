[workspace]
channels = ["conda-forge"]
name = "kt-exp-graph"
platforms = ["linux-64"]

[pypi-options]
index-url = "https://pypi.org/simple"

# General pypi dependencies for all features
[pypi-dependencies]
swanlab = ">=0.7.13,<0.8"

[feature.gpu.system-requirements]
cuda = "12.8"
[feature.gpu.dependencies]
cuda-version = "==12.8"
python = "3.12.*"
optuna = "==4.8.0"
scikit-learn = "==1.8.0"
pandas = "==3.0.2"
pyarrow = ">=23.0.0,<24"
python-dotenv = ">=1.2.1,<2"
ruff = ">=0.15,<0.16"
pytest = ">=9.0.2,<10"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.8,<4"
[feature.gpu.pypi-dependencies]
torch = "==2.10.0+cu128"
pyg_lib = "==0.6.0"
torch-scatter = "==2.1.2"
torch-geometric = "==2.7.0"
polars = { version = ">=1.39.3,<2", extras = ["rt64"] }
[feature.gpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
find-links = [{ url = "https://data.pyg.org/whl/torch-2.10.0+cu128.html" }]

[feature.mamba.system-requirements]
cuda = "12.8"
[feature.mamba.dependencies]
cuda-version = "==12.8"
python = "3.12.*"
optuna = "==4.8.0"
scikit-learn = "==1.8.0"
pandas = "==3.0.2"
pyarrow = ">=23.0.0,<24"
python-dotenv = ">=1.2.1,<2"
ruff = ">=0.15,<0.16"
pytest = ">=9.0.2,<10"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.8,<4"
[feature.mamba.pypi-dependencies]
torch = "==2.10.0+cu128"
pyg_lib = "==0.6.0"
torch-scatter = "==2.1.2"
torch-geometric = "==2.7.0"
polars = { version = ">=1.39.3,<2", extras = ["rt64"] }
#mamba-ssm = { version = "==2.3.1", extras = ["causal-conv1d"] }
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.3.1/mamba_ssm-2.3.1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.1.post4/causal_conv1d-1.6.1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
[feature.mamba.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
find-links = [{ url = "https://data.pyg.org/whl/torch-2.10.0+cu128.html" }]

[feature.cpu.system-requirements]
cuda = "12.8"
[feature.cpu.dependencies]
cuda-version = "==12.8"
python = "3.12.*"
optuna = "==4.8.0"
scikit-learn = "==1.8.0"
pandas = "==3.0.2"
pyarrow = ">=23.0.0,<24"
python-dotenv = ">=1.2.1,<2"
ruff = ">=0.15,<0.16"
pytest = ">=9.0.2,<10"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.8,<4"
[feature.cpu.pypi-dependencies]
torch = "==2.10.0+cpu"
pyg_lib = "==0.6.0"
torch-scatter = "==2.1.2"
torch-geometric = "==2.7.0"
polars = { version = ">=1.39.3,<2", extras = ["rt64"] }
[feature.cpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]
find-links = [{ url = "https://data.pyg.org/whl/torch-2.10.0+cpu.html" }]

[feature.dhg-gpu.system-requirements]
cuda = "11.7"
[feature.dhg-gpu.dependencies]
cuda-version = "11.7.*"
python = "3.10.*"
optuna = ">=4.6.0,<5"
scikit-learn = ">=1.7.2,<2"
pandas = ">=2.3.3,<3"
pyarrow = ">=12.0.1,<13"
python-dotenv = ">=1.2.1,<2"
ruff = ">=0.15,<0.16"
pytest = ">=9.0.2,<10"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.8,<4"
[feature.dhg-gpu.pypi-dependencies]
dhg = "==0.9.*"
torch = "==1.13.1+cu117"
pyg_lib = ">=0.4.0,<0.5"
torch-scatter = "==2.1.1"
torch-geometric = ">=2.7.0, <3"
polars = { version = ">=1.38.1, <2", extras = ["rt64"] }
[feature.dhg-gpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu117"]
find-links = [{ url = "https://data.pyg.org/whl/torch-1.13.1+cu117.html" }]

[feature.dhg-cpu.pypi-dependencies]
dhg = "==0.9.*"
torch = "==1.13.1"
pyg_lib = ">=0.4.0,<0.5"
torch-scatter = "==2.1.1"
torch-geometric = ">=2.7.0, <3"
polars = { version = ">=1.38.1, <2", extras = ["rt64"] }
[feature.dhg-cpu.dependencies]
python = "3.10.*"
optuna = ">=4.6.0,<5"
scikit-learn = ">=1.7.2,<2"
pandas = ">=2.3.3,<3"
pyarrow = ">=12.0.1,<13"
python-dotenv = ">=1.2.1,<2"
ruff = ">=0.15,<0.16"
pytest = ">=9.0.2,<10"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.8,<4"
[feature.dhg-cpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]
find-links = [{ url = "https://data.pyg.org/whl/torch-1.13.1+cpu.html" }]

[feature.web.dependencies]
python = "3.12.*"
python-dotenv = ">=1.2.1,<2"
[feature.web.pypi-dependencies]
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.34.0", extras = ["standard"] }
sqlalchemy = ">=2.0.0"
pydantic = ">=2.0.0"
psutil = ">=6.0.0"

[environments]
dhg-cpu = { features = ["dhg-cpu"] }
dhg-gpu = { features = ["dhg-gpu"] }
cpu = { features = ["cpu"] }
mamba = { features = ["mamba"] }
web = { features = ["gpu", "web"] }

default = { features = ["gpu"] }

[tasks]
lint = "ruff check ."
fmt = "ruff format ."
ckf = [{ task = "lint" }, { task = "fmt" }]
clean-cache = "find . -name '__pycache__' -type d -print0 | xargs -0 rm -rf && find . -name '*.py[co]' -delete && rm -rf runs/* swanlog/*"
web-backend = { cmd = "python -m uvicorn main:app --host 127.0.0.1 --port 8765", cwd = "web/backend", env = { PYTHONPATH = "../../" } }

