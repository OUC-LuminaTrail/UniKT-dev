# Optuna study-level configuration
sampler: tpe
sampler_kwargs:
  seed: 42
  n_startup_trials: 10

# median | percentile | successive_halving | hyperband | null
pruner: median
pruner_kwargs:
  n_startup_trials: 5
  n_warmup_steps: 10

n_trials: 100
n_jobs: 1
timeout: null
study_name: hyperparameter_search
db_url: null
save_dir: ./optuna_results
verbose: 1
