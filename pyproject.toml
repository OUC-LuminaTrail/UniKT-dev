[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

ignore = [
    "E501",    # 行太长
    "SIM117",  # 嵌套 with 语句
]

[tool.ruff.lint.isort]
known-first-party = ["utils", "model"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
