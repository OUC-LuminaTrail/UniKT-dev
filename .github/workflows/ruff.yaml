---
name: Ruff

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    ruff:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/ruff-action@v4.0.0
              with:
                  args: check
                  src: .
            - uses: astral-sh/ruff-action@v4.0.0
              with:
                  args: format --check --diff
                  src: .
